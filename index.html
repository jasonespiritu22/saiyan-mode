*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#F3F5FA;--sheet:#FFFFFF;--ink:#131E44;--ink2:#535E86;--line:#2B3A97;--rule:#C7CEE2;--wash:#E7EBF6;
  --red:#C5301D;--redwash:#FAE8E4;
  --display:"Big Shoulders Display","Arial Narrow","Roboto Condensed","Helvetica Neue",Arial,sans-serif;
  --text:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --rail:224px;--top:56px;--bar:58px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0C2748;--sheet:#11335E;--ink:#EAF1FB;--ink2:#A3BBDA;--line:#C4DAF5;--rule:#2A5187;--wash:#16406F;
    --red:#FF8E78;--redwash:rgba(255,142,120,.14);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0C2748;--sheet:#11335E;--ink:#EAF1FB;--ink2:#A3BBDA;--line:#C4DAF5;--rule:#2A5187;--wash:#16406F;
  --red:#FF8E78;--redwash:rgba(255,142,120,.14);color-scheme:dark;
}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--top) + 12px)}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--text);overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
a{color:var(--line)}

/* ---------- shell ---------- */
.top{position:sticky;top:0;z-index:20;height:calc(var(--top) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:stretch;justify-content:space-between;background:var(--paper);border-bottom:1px solid var(--line)}
.mark{font:800 27px/1 var(--display);text-transform:uppercase;letter-spacing:.03em;color:var(--ink);background:none;border:0;padding:0 16px;cursor:pointer}
.tb{display:flex;min-width:0}
.tb div{padding:6px 14px;border-left:1px solid var(--rule);display:flex;flex-direction:column;justify-content:center;min-width:0}
.tb small{font-size:11px;line-height:1.2;color:var(--ink2);white-space:nowrap}
.tb b{font:700 19px/1.1 var(--display);letter-spacing:.01em;white-space:nowrap;font-variant-numeric:tabular-nums}
.rail .grp>button{font:700 20px/1 var(--display);letter-spacing:.02em;background:none;border:0;color:var(--ink2);cursor:pointer}
.rail .grp.on>button{color:var(--ink)}
main{min-width:0;padding:20px 16px 64px}
#view>*:first-child{margin-top:0}

@media (max-width:899px){
  .tb .wide{display:none}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--paper);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  .rail .grp{flex:1;min-width:0}
  .rail .grp>button{width:100%;height:var(--bar);font-size:18px;border-top:3px solid transparent}
  .rail .grp.on>button{border-top-color:var(--red)}
  .rail .sub{display:none}
  main{padding-bottom:calc(var(--bar) + 40px + env(safe-area-inset-bottom,0px))}
}
@media (min-width:900px){
  .shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr)}
  .rail{position:sticky;top:var(--top);align-self:start;height:calc(100vh - var(--top));overflow:auto;border-right:1px solid var(--rule);padding:22px 0}
  .rail .grp>button{display:block;width:100%;text-align:left;padding:9px 20px;font-size:22px}
  .rail .sub{display:none;padding:2px 0 12px}
  .rail .grp.on .sub{display:block}
  .rail .sub button{display:block;width:100%;text-align:left;font:400 15px/1.3 var(--text);color:var(--ink2);background:none;border:0;border-left:3px solid transparent;padding:6px 20px 6px 17px;cursor:pointer}
  .rail .sub button:hover{color:var(--ink)}
  .rail .sub button.on{color:var(--ink);font-weight:600;border-left-color:var(--red)}
  main{padding:32px 48px 80px;max-width:920px}
  .mark{padding:0 20px}
  .tabs{display:none!important}
}

/* ---------- type ---------- */
h1{font:800 clamp(46px,11vw,88px)/.9 var(--display);text-transform:uppercase;letter-spacing:.005em;margin:8px 0 16px;max-width:9em}
h2{font:700 clamp(32px,6vw,44px)/1 var(--display);letter-spacing:.01em;margin:0 0 12px}
h3{font:700 25px/1.1 var(--display);letter-spacing:.015em;margin:0 0 10px}
h4{font:600 16px/1.3 var(--text);margin:20px 0 6px}
p{margin:0 0 12px;max-width:68ch}
ul,ol{margin:0 0 12px;padding-left:22px;max-width:68ch}
li{margin-bottom:5px}
.lede{font-size:18px;line-height:1.45;max-width:60ch}
.sub2{color:var(--ink2);font-size:15px}
.blk{margin-top:36px}
.note{border-left:3px solid var(--red);background:var(--redwash);padding:10px 14px;max-width:68ch}
small,.small{font-size:14px}
.muted{color:var(--ink2)}
.est{font-size:11px;color:var(--red);border:1px solid var(--red);padding:0 4px;border-radius:2px;white-space:nowrap;vertical-align:1px}
b,strong{font-weight:600}

/* ---------- tabs ---------- */
.tabs{display:flex;gap:22px;overflow-x:auto;border-bottom:1px solid var(--rule);margin:-12px -16px 22px;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;font:600 15px/1 var(--text);color:var(--ink2);background:none;border:0;border-bottom:3px solid transparent;padding:14px 0 11px;cursor:pointer;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--red)}

/* ---------- controls ---------- */
.btn{font:600 15px/1.2 var(--text);color:var(--line);background:transparent;border:1px solid var(--line);border-radius:2px;padding:10px 14px;min-height:44px;cursor:pointer}
.btn.solid{background:var(--line);color:var(--paper)}
.btn.quiet{border-color:var(--rule);color:var(--ink2)}
.btn.tiny{min-height:32px;padding:4px 10px;font-size:13px}
.seg{display:inline-flex;max-width:100%;border:1px solid var(--line);border-radius:2px;overflow:hidden}
.seg button{flex:1 1 auto;font:600 15px/1.2 var(--text);padding:10px 14px;min-height:44px;background:transparent;color:var(--line);border:0;border-right:1px solid var(--line);cursor:pointer;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--line);color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 12px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px 16px;margin:14px 0 20px}
label.f{display:block;font-size:14px;color:var(--ink2);min-width:0}
label.f.span2{grid-column:span 2}
input,select,textarea{display:block;width:100%;min-height:44px;margin-top:3px;padding:9px 10px;background:var(--sheet);color:var(--ink);border:1px solid var(--rule);border-radius:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:1px;border-color:var(--line)}
input[type=checkbox]{display:inline-block;width:22px;height:22px;min-height:0;margin:0;padding:0;accent-color:var(--line)}
textarea{min-height:120px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace}

/* ---------- title-block cells ---------- */
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--sheet);border:1px solid var(--line);margin:14px 0 18px;overflow:hidden}
.cell{background:var(--sheet);padding:10px 12px 12px;min-width:0;box-shadow:1px 0 0 var(--rule),0 1px 0 var(--rule)}
.cell small{display:block;font-size:13px;color:var(--ink2);margin-bottom:4px}
.cell b{font:700 34px/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.cell b span{font:400 14px/1 var(--text);color:var(--ink2);letter-spacing:0}
.cell.hot b{color:var(--red)}

/* ---------- tables ---------- */
.scroll{overflow-x:auto;margin:12px 0 16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th{text-align:left;font-weight:600;color:var(--line);border-bottom:1px solid var(--line);padding:8px 14px 8px 0;vertical-align:bottom}
td{border-bottom:1px solid var(--rule);padding:8px 14px 8px 0;vertical-align:top}
th:last-child,td:last-child{padding-right:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td:first-child{font-weight:600}
table.plain td:first-child{font-weight:400}
table.wide{min-width:640px}
tr.sum td{border-bottom:0;border-top:1px solid var(--line);font-weight:600}
.kv{display:grid;grid-template-columns:minmax(96px,150px) minmax(0,1fr);gap:8px 16px;margin:0 0 4px}
.kv dt{font-size:14px;color:var(--ink2);padding-top:1px}
.kv dd{margin:0;max-width:60ch}
@media (max-width:560px){.kv{grid-template-columns:1fr;gap:2px}.kv dd{margin-bottom:10px}}

/* ---------- hero timeline ---------- */
.hero{padding-bottom:8px;border-bottom:1px solid var(--rule)}
.tl{margin:34px 0 0;position:relative}
.tl-spans{display:flex}
.tl-span{position:relative;min-width:0;text-align:center;border-left:1px solid var(--line);padding-bottom:10px}
.tl-span:last-child{border-right:1px solid var(--line)}
.tl-span b{display:block;font:700 20px/1 var(--display);color:var(--line);padding-bottom:5px}
.tl-span::after{content:"";position:absolute;left:3px;right:3px;bottom:5px;border-top:1px solid var(--line)}
.tl-axis{position:relative;height:14px;border-top:2px solid var(--ink);background:repeating-linear-gradient(90deg,var(--ink2) 0 1px,transparent 1px calc(100% / 48)) left top/100% 7px no-repeat}
.tl-now{position:absolute;top:-52px;bottom:0;width:0;border-left:2px solid var(--red)}
.tl-now span{position:absolute;bottom:100%;left:-1px;transform:translateX(-50%);white-space:nowrap;font:600 13px/1.5 var(--text);color:var(--red)}
.tl-now.l span{transform:none}
.tl-now.r span{transform:translateX(-100%)}
.tl-marks{position:relative;height:22px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.tl-marks span{position:absolute;top:2px;transform:translateX(-50%)}
.tl-marks span:first-child{transform:none}
.tl-marks span:last-child{transform:translateX(-100%)}
.tl-key{list-style:none;padding:0;margin:10px 0 18px;display:flex;flex-wrap:wrap;gap:4px 22px;font-size:14px;max-width:none}
.tl-key li{margin:0}
.tl-key b{font:700 17px/1 var(--display);color:var(--line);margin-right:5px}
.tl-key span{color:var(--ink2)}

/* ---------- week strip ---------- */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--rule);border:1px solid var(--line);margin:16px 0}
.week>*{background:var(--sheet);border:0;padding:8px 2px;text-align:center;font-size:12px;line-height:1.25;color:var(--ink2);min-height:58px;min-width:0}
.week b{display:block;font:700 19px/1 var(--display);color:var(--ink);margin-bottom:4px}
.week button{cursor:pointer}
.week button[aria-pressed="true"]{background:var(--line);color:var(--paper)}
.week button[aria-pressed="true"] b{color:var(--paper)}

/* ---------- exercise and meal rows ---------- */
.exlist{border-top:1px solid var(--line);margin:14px 0 8px}
.ex{border-bottom:1px solid var(--rule)}
.ex>summary{display:grid;grid-template-columns:30px minmax(0,1fr) 18px;gap:8px;padding:14px 0;cursor:pointer;list-style:none}
.ex>summary::-webkit-details-marker{display:none}
.ex>summary::after{content:"";width:9px;height:9px;border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg);align-self:center;justify-self:center;margin-top:-4px}
.ex[open]>summary::after{transform:rotate(-135deg);margin-top:4px}
.ex-n{font:700 26px/1 var(--display);color:var(--line);font-variant-numeric:tabular-nums}
.ex-role{display:block;font-size:13px;color:var(--ink2)}
.ex-name{display:block;font-weight:600;font-size:17px;line-height:1.3}
.ex-spec{display:flex;flex-wrap:wrap;margin-top:5px;font-size:14px;font-variant-numeric:tabular-nums}
.ex-spec span{padding-right:10px;margin-right:10px;border-right:1px solid var(--rule)}
.ex-spec span:last-child{border:0;margin:0;padding:0}
.ex-body{padding:2px 0 20px 38px}
@media (max-width:560px){.ex-body{padding-left:0}}
.pri{display:inline-block;width:9px;height:8px;margin-left:6px;background:var(--red);clip-path:polygon(50% 0,100% 100%,0 100%)}
.tag{display:inline-block;font-size:12px;color:var(--ink2);border:1px solid var(--rule);padding:0 5px;border-radius:2px;margin-left:6px;white-space:nowrap}
.match{font-size:12px;border:1px solid var(--rule);padding:0 5px;border-radius:2px;white-space:nowrap;color:var(--ink2)}
.match.different{color:var(--red);border-color:var(--red)}
.lvs{display:grid;gap:1px;background:var(--rule);border:1px solid var(--rule);margin:0 0 14px}
.lvs button{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:10px;align-items:baseline;text-align:left;padding:10px 12px;background:var(--sheet);border:0;cursor:pointer;min-height:44px}
.lvs button small{color:var(--ink2);font-size:13px}
.lvs button span:last-child{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
.lvs button[aria-pressed="true"]{background:var(--wash);box-shadow:inset 3px 0 0 var(--red);font-weight:600}
@media (max-width:560px){.lvs button{grid-template-columns:minmax(0,1fr) auto}.lvs button small{grid-column:1/-1}}
.log{margin-top:16px;padding-top:14px;border-top:1px dashed var(--rule)}
.log-row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.log-row label{font-size:13px;color:var(--ink2);width:112px}
.log p{margin:10px 0 0;font-size:14px}
.swap{border-top:1px solid var(--line)}
.swap>div{padding:14px 0;border-bottom:1px solid var(--rule)}
.swap h4{margin:0 0 8px}
.swap p{margin:8px 0 0;font-size:14px;color:var(--ink2)}

/* ---------- meals and groceries ---------- */
.days{display:flex;border:1px solid var(--line);border-radius:2px;overflow:hidden;margin:14px 0}
.days button{flex:1;min-width:0;min-height:46px;font:700 18px/1 var(--display);letter-spacing:.02em;background:transparent;color:var(--line);border:0;border-right:1px solid var(--line);cursor:pointer;padding:0}
.days button:last-child{border-right:0}
.days button[aria-pressed="true"]{background:var(--line);color:var(--paper)}
.gro{list-style:none;margin:0 0 20px;padding:0;border-top:1px solid var(--line);max-width:none}
.gro li{display:grid;grid-template-columns:26px minmax(0,1fr) 96px 62px;gap:2px 10px;align-items:center;padding:9px 0;margin:0;border-bottom:1px solid var(--rule)}
.gro .g-name{font-weight:600;line-height:1.3}
.gro .g-need{display:block;font-size:13px;font-weight:400;color:var(--ink2)}
.gro .g-price input{min-height:36px;padding:5px 8px;text-align:right;margin:0}
.gro .g-price small{display:block;font-size:11px;line-height:1.3;color:var(--ink2);text-align:right}
.gro .g-cost{text-align:right;font-variant-numeric:tabular-nums}
.gro li.done .g-name{text-decoration:line-through;color:var(--ink2)}
.gcat{font:700 20px/1 var(--display);letter-spacing:.02em;color:var(--line);margin:22px 0 8px}

/* ---------- tracking ---------- */
.chart{display:block;width:100%;height:auto;border:1px solid var(--rule);background:var(--sheet);margin:10px 0 6px}
.chart polyline{fill:none;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .cw{stroke:var(--line);fill:var(--line)}
.chart .cz{stroke:var(--red);fill:var(--red)}
.chart polyline.cw,.chart polyline.cz{fill:none}
.key i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin-right:6px}
.key .kw{background:var(--line)}
.key .kz{background:var(--red)}
.verdict{border:1px solid var(--line);background:var(--sheet);padding:12px 14px;margin:14px 0;max-width:68ch}
.verdict b{display:block;font:700 22px/1.1 var(--display);letter-spacing:.015em;margin-bottom:4px}
.verdict.act{border-color:var(--red)}
.verdict.act b{color:var(--red)}

.foot{margin-top:60px;padding-top:16px;border-top:1px solid var(--rule);font-size:13px;color:var(--ink2)}
.foot p{max-width:76ch}
.allhead{font:800 clamp(40px,8vw,64px)/.95 var(--display);text-transform:uppercase;margin:56px 0 20px;padding-top:20px;border-top:2px solid var(--ink)}

@media print{
  :root,:root[data-theme="dark"],:root:not([data-theme="light"]){--paper:#fff;--sheet:#fff;--ink:#000;--ink2:#444;--line:#1a2a7a;--rule:#bbb;--wash:#eee;--red:#b02010;--redwash:#f6f6f6}
  .top,.rail,.tabs,.noprint,.log,.foot{display:none!important}
  .shell{display:block}
  main{max-width:none;padding:0}
  details,tr,.cells{break-inside:avoid}
  h2,h3,h4{break-after:avoid}
}
@media (prefers-reduced-motion:no-preference){
  .ex>summary::after{transition:transform .15s}
}
.tabs[hidden]{display:none}
.ex.meal>summary{grid-template-columns:minmax(0,1fr) 18px}
.ex.meal .ex-body{padding-left:0}

.btn[disabled]{opacity:.5;cursor:default}
code{font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--wash);padding:1px 4px;border-radius:2px}
.idea{border:1px solid var(--line);background:var(--sheet);padding:14px 16px 16px;margin:16px 0}
.idea h3{margin-bottom:6px}
.idea .ex-spec{margin:0 0 4px}
.idea ol{margin-top:10px}
.idea .row{margin:12px 0 0}
.idea select,.mine select{min-height:44px;margin:0;width:auto;max-width:100%;flex:1 1 220px}
.ai-busy{display:inline-block;width:14px;height:14px;border:2px solid var(--rule);border-top-color:var(--red);border-radius:50%;vertical-align:-2px;margin-right:8px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ai-busy{animation:none}}
.mine{list-style:none;padding:0;margin:0;border-top:1px solid var(--line);max-width:none}
.mine li{padding:12px 0;margin:0;border-bottom:1px solid var(--rule)}
.mine .row{margin:8px 0 0}

</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">This plan needs JavaScript turned on.</p></noscript>
<script>
/* ---------- TRAINING DATA ----------
   Each day is a list of movement slots. Every slot has one exercise per
   environment, so the week keeps the same structure wherever you train. */

const ENVS = {
  gym:  { label: 'Gym',        long: 'Commercial gym' },
  home: { label: 'Home',       long: 'Home, your current kit' },
  cali: { label: 'Bodyweight', long: 'Calisthenics' }
};
const LEVELS = ['Beginner', 'Intermediate', 'Advanced'];

const WEEKPLAN = [
  { d: 'Mon', full: 'Monday',    day: 'UA', what: 'Upper A' },
  { d: 'Tue', full: 'Tuesday',   day: 'LA', what: 'Lower A' },
  { d: 'Wed', full: 'Wednesday', day: null, what: 'Recovery', note: '20–30 minutes of easy walking or cycling, plus the 10-minute mobility flow. Mini meal prep.' },
  { d: 'Thu', full: 'Thursday',  day: 'UB', what: 'Upper B' },
  { d: 'Fri', full: 'Friday',    day: 'LB', what: 'Lower B' },
  { d: 'Sat', full: 'Saturday',  day: null, what: 'Optional', note: '30–45 minutes of something easy you enjoy: a hike, a bike ride, a sport. Or a make-up session if you missed one.' },
  { d: 'Sun', full: 'Sunday',    day: null, what: 'Rest', note: 'Full rest. Weekly check-in in the morning, main meal prep in the afternoon.' }
];

const DAYS = [
/* ================= UPPER A ================= */
{ id: 'UA', name: 'Upper A', when: 'Monday', mins: '60–70',
  focus: 'Heavier day. A big press and a big row first, then shoulders and arms.',
  slots: [
  { id: 'ua1', role: 'Horizontal press', mus: 'Chest, front delts, triceps', star: 1,
    vol: { p: ['Chest'], s: ['Shoulders', 'Triceps'] },
    gym: { n: 'Barbell bench press', sets: 3, reps: '5–8', rest: '2–3 min', rir: '2–3',
      how: 'Eyes under the bar, shoulder blades pinched back and down, feet planted. Lower to the lower chest with elbows 45–70° from your sides, touch lightly, press back up over the shoulders.',
      err: 'Bouncing the bar, elbows flared to 90°, hips lifting. Set the safeties or use a spotter, and keep your thumbs wrapped around the bar.',
      alt: 'Dumbbell bench press, machine chest press or Smith-machine bench.' },
    home: { n: 'Dumbbell floor press', sets: 3, reps: '8–12', rest: '2 min', rir: '1–3',
      how: 'Sit with the dumbbells on your thighs and roll back onto the mat, knees bent. Lower until the upper arms rest on the floor, pause 1–2 seconds with no bounce, press up and slightly in.',
      err: 'Slamming the elbows into the floor, flared elbows, relaxing at the bottom.',
      alt: 'Band-resisted push-ups.',
      cap: 'At 25 kg for 12: 3-second lowers with a 2-second pause, then 1.5 reps, then single-arm floor press. After that, make weighted or banded deficit push-ups the main lift.',
      up: 'With a bench: flat dumbbell bench press, for a full stretch at the bottom.' },
    cali: { sets: 4, rest: '2 min', rir: '1–3',
      err: 'Sagging hips, half reps, head reaching for the floor.',
      alt: 'Sore wrists: use push-up handles or make fists on the mat.',
      lv: [
        { n: 'Incline push-up → knee push-up → push-up', reps: '6–12', how: 'Hands on a counter or sofa arm, and lower the surface as you get stronger. Body in one line, chest to the edge, elbows about 45° from your sides.' },
        { n: 'Feet-elevated or deficit push-up', reps: '8–15', how: 'Feet on a chair, or hands on blocks for extra depth. Two seconds down, light pause, press, and finish by pushing the floor away.' },
        { n: 'Weighted push-up or archer push-up', reps: '6–12', how: 'A loaded backpack or vest sitting high on the upper back, or shift most of your weight onto one arm. Same strict line.' }
      ] },
    match: 'close', eq: 'The floor press stops at the floor, so the chest gets less work in the stretched position. The push-up slot on Upper B covers that range.' },

  { id: 'ua2', role: 'Horizontal pull', mus: 'Mid-back, lats, rear delts, biceps', star: 1,
    vol: { p: ['Back'], s: ['Biceps', 'Rear delts'] },
    gym: { n: 'Chest-supported row', sets: 3, reps: '8–10', rest: '2 min', rir: '1–3',
      how: 'Machine, T-bar, or dumbbells lying face down on an incline bench. Chest stays on the pad. Pull the elbows back toward the hips, squeeze the shoulder blades together for a beat, lower to a full stretch.',
      err: 'Shrugging toward the ears, lifting the chest off the pad, cutting the stretch short.',
      alt: 'Seated cable row, barbell row or one-arm dumbbell row.' },
    home: { n: 'One-arm dumbbell row', sets: 3, reps: '8–12 per side', rest: '90 s', rir: '1–3',
      how: 'Free hand on a sturdy chair or sofa arm, back flat, feet staggered. Pull the dumbbell toward your hip pocket, pause, lower until the shoulder blade glides forward.',
      err: 'Twisting the torso open, yanking with the lower back, short range.',
      alt: 'Band row, with the band anchored at chest height or looped around your feet.',
      cap: 'At 25 kg for 12: add a 2-second squeeze at the top and 3-second lowers, then sets of 15–20, then stand on a band looped over the handle.',
      up: 'With a bench: chest-supported incline row, which is stricter and easier on the lower back.' },
    cali: { sets: 4, rest: '90 s–2 min', rir: '1–3',
      err: 'Hips sagging, chin reaching for the bar instead of the chest, shrugging.',
      alt: 'No low bar or rings: band rows, or one-arm dumbbell rows from your home kit. Rings or a suspension trainer hung from the pull-up bar solve this for good.',
      lv: [
        { n: 'Inverted row, body at 45°', reps: '6–12', how: 'Bar or rings at waist height, knees bent, heels on the floor. Pull your chest to the bar with a rigid body and elbows about 45° out.' },
        { n: 'Inverted row, body horizontal', reps: '6–12', how: 'Feet on a chair so you are level at the top. Hold for 1 second with the chest at the bar.' },
        { n: 'Weighted or archer inverted row', reps: '6–10', how: 'Add a vest or backpack, or pull toward one hand while the other arm stays long.' }
      ] },
    match: 'close', eq: 'All three are horizontal pulls for the same muscles. The bodyweight version needs something to hang under.' },

  { id: 'ua3', role: 'Overhead press', mus: 'Shoulders, triceps, upper chest', star: 1,
    vol: { p: ['Shoulders'], s: ['Triceps'] },
    gym: { n: 'Seated dumbbell shoulder press', sets: 3, reps: '6–10', rest: '2 min', rir: '1–3',
      how: 'Bench one notch below upright. Start at ear level with forearms vertical, press up and slightly in to straight arms, lower under control.',
      err: 'A big arch off the pad, half reps, elbows drifting behind the body.',
      alt: 'Standing barbell overhead press or machine shoulder press.' },
    home: { n: 'Standing dumbbell overhead press', sets: 3, reps: '6–10', rest: '2 min', rir: '1–3',
      how: 'Feet hip-width, glutes and abs tight. Press from the shoulders up and slightly back so your arms finish beside your ears. No leg drive.',
      err: 'Leaning back until it becomes a standing incline press, ribs flaring.',
      alt: 'Half-kneeling single-arm press if the ceiling is low.',
      cap: 'Single-arm presses, 3-second lowers and 1.5 reps come first. Then add feet-elevated pike push-ups.',
      up: 'With a bench: seated press with back support, so you can push closer to failure safely.' },
    cali: { sets: 3, rest: '2 min', rir: '1–3',
      err: 'Elbows flaring wide, head landing between the hands, short range.',
      alt: 'Pinching in the wrist or shoulder: reduce the depth, or use band overhead presses for a few weeks.',
      lv: [
        { n: 'Pike push-up', reps: '5–10', how: 'Hips high in an upside-down V, hands shoulder-width. Lower the top of your head toward a spot in front of your hands so the forearms stay vertical, then press back up.' },
        { n: 'Feet-elevated pike push-up', reps: '5–10', how: 'Feet on a chair, hips stacked over the shoulders. Same head-forward path, full lockout at the top.' },
        { n: 'Wall handstand push-up', reps: '3–8', how: 'Start with 5-second lowers onto a cushion, then full reps, then add depth with blocks under the hands.' }
      ] },
    match: 'close', eq: 'Pike push-ups load the shoulders less than a dumbbell press at first and catch up as your feet go higher.' },

  { id: 'ua4', role: 'Vertical pull', mus: 'Lats, biceps', star: 1,
    vol: { p: ['Back'], s: ['Biceps'] },
    gym: { n: 'Lat pulldown', sets: 3, reps: '8–12', rest: '90 s–2 min', rir: '1–3',
      how: 'Grip just outside the shoulders, slight lean back. Drive the elbows down to bring the bar to your upper chest, then let the arms go fully long.',
      err: 'Leaning far back and rowing it, pulling behind the neck, using momentum.',
      alt: 'Assisted pull-up machine, or pull-ups.' },
    home: { n: 'Pull-up, overhand grip', sets: 3, reps: '3–10', rest: '2 min', rir: '1–2',
      how: 'From a dead hang, pull the shoulder blades down first, then drive the elbows to your ribs until your chin clears the bar. Lower for 2–3 seconds. Fewer than 3 reps: loop a band under one knee, or do 5-second lowers only.',
      err: 'Half reps, kipping, craning the chin over the bar.',
      alt: 'Kneeling band pulldown with the band looped over the bar.',
      cap: 'At 3 sets of 10: add a loaded backpack or a dip belt, or slow the lowering to 4 seconds.' },
    cali: { sets: 3, rest: '2 min', rir: '1–2',
      err: 'Half reps, kipping, craning the chin over the bar.',
      alt: 'No bar available: band pulldowns. Long term, nothing replaces the bar.',
      lv: [
        { n: 'Dead hang, band-assisted pull-up, slow lowers', reps: '3–6', how: 'Hang for 20–30 seconds, practise pulling the shoulders down, then use a band or 5-second lowers until you own 3 strict reps.' },
        { n: 'Strict pull-up', reps: '5–10', how: 'Dead hang to chin over the bar with 2-second lowers. Add a pause at the top once 8 reps feel smooth.' },
        { n: 'Weighted or archer pull-up', reps: '4–8', how: 'Dip belt or backpack for load, or pull toward one hand while the other arm stays long.' }
      ] },
    match: 'close', eq: 'Pulldowns and pull-ups are the same pattern. Pull-ups add grip and core demand, and the load is your body weight whether you are ready or not.' },

  { id: 'ua5', role: 'Side delts', mus: 'Lateral deltoids', star: 1, pair: 1,
    vol: { p: ['Shoulders'], s: [] },
    gym: { n: 'Cable lateral raise', sets: 3, reps: '12–15', rest: '60–75 s', rir: '0–2',
      how: 'Pulley at about hand height, handle in the far hand, slight lean away. Raise out and a little forward to shoulder height, leading with the elbow. Two seconds down.',
      err: 'Shrugging, swinging, going heavy. Smooth reps beat big numbers here.',
      alt: 'Dumbbell or machine lateral raise.' },
    home: { n: 'Dumbbell lateral raise', sets: 3, reps: '12–20', rest: '60 s', rir: '0–2',
      how: 'Slight forward lean, soft elbows. Raise to shoulder height with thumbs level or slightly up, take 2–3 seconds down, and stop just short of your thighs to keep tension on.',
      err: 'Shrugging, swinging, picking a weight you have to heave.',
      alt: 'Band lateral raise, standing on the band.',
      cap: 'You will not outgrow 25 kg here. Progress with reps, slower lowers and a pause at the top.' },
    cali: { sets: 3, rest: '60 s', rir: '0–2',
      err: 'Shrugging and swinging.',
      alt: 'No band: hold water jugs or a loaded backpack by its strap. There is no good pure-bodyweight replacement.',
      lv: [
        { n: 'Band lateral raise', reps: '12–20', how: 'Stand on the band and raise to shoulder height with a 2-second lower. Stand wider on the band to make it harder.' },
        { n: 'Band lateral raise with a pause', reps: '15–20', how: 'Hold each rep for 2 seconds at shoulder height.' },
        { n: 'Single-arm lean-away band raise', reps: '15–25', how: 'Hold a doorframe and lean away. Finish each set with 5 half reps from the bottom.' }
      ] },
    match: 'different', eq: 'There is no bodyweight lateral raise. Pike push-ups are a press: they train the front delts and triceps, not the side delts that create width. Keep a real lateral raise in every environment, with a band if nothing else.' },

  { id: 'ua6', role: 'Triceps', mus: 'Triceps', pair: 2,
    vol: { p: ['Triceps'], s: [] },
    gym: { n: 'Cable rope pushdown', sets: 3, reps: '10–15', rest: '60 s', rir: '0–2',
      how: 'Elbows pinned to your sides, slight forward lean. Extend fully and spread the rope at the bottom, then return slowly to just above 90°.',
      err: 'Elbows drifting forward, shoulders rolling over the rope.',
      alt: 'Close-grip push-ups or assisted dips.' },
    home: { n: 'Dumbbell overhead triceps extension', sets: 3, reps: '10–15', rest: '60–75 s', rir: '0–2',
      how: 'One dumbbell in both hands, elbows pointing up and slightly in. Lower behind the head into a deep stretch, then extend without moving the upper arms.',
      err: 'Elbows flaring out, lower back arching.',
      alt: 'Band pushdown with the band looped over the pull-up bar.',
      cap: 'Single-arm version and 3-second lowers.' },
    cali: { sets: 3, rest: '60–90 s', rir: '0–2',
      err: 'Elbows flaring, hips sagging.',
      alt: 'Band pushdowns.',
      lv: [
        { n: 'Close-grip push-up from the knees or on an incline', reps: '8–15', how: 'Hands under the chest, a little narrower than shoulder width, elbows brushing the ribs.' },
        { n: 'Diamond push-up', reps: '8–15', how: 'Thumbs and index fingers close together under the chest. Lower until the chest touches your hands.' },
        { n: 'Diamond push-up, feet elevated or weighted', reps: '8–12', how: 'Feet on a chair, or a backpack on the upper back.' }
      ] },
    match: 'partial', eq: 'Diamond push-ups are a compound lift, so the chest and shoulders share the work. The two upper days use different triceps moves on purpose: an overhead extension trains the long head in a stretch, a pushdown does not.' },

  { id: 'ua7', role: 'Biceps', mus: 'Biceps', pair: 2,
    vol: { p: ['Biceps'], s: [] },
    gym: { n: 'Incline dumbbell curl', sets: 3, reps: '8–12', rest: '60–75 s', rir: '0–2',
      how: 'Bench at 45–60°, arms hanging behind the torso. Curl without letting the elbows travel forward, then lower for 2–3 seconds to a full stretch.',
      err: 'Swinging, shortening the bottom of the rep. The stretch is the point.',
      alt: 'EZ-bar curl or cable curl.' },
    home: { n: 'Standing dumbbell curl', sets: 3, reps: '8–12', rest: '60 s', rir: '0–2',
      how: 'Elbows by your sides, palms turning up as you curl. Squeeze at the top and lower for 2–3 seconds to straight arms.',
      err: 'Leaning back, elbows drifting forward, half reps at the bottom.',
      alt: 'Band curl.',
      cap: 'Not a concern for years. Use 3-second lowers and 1.5 reps before you add weight.',
      up: 'With a bench: incline curls for a loaded stretch.' },
    cali: { sets: 3, rest: '60–90 s', rir: '0–2',
      err: 'Hips sagging, turning it into a row by letting the elbows travel back.',
      alt: 'No low bar or rings: band curls, or hold the top half of a chin-up for 3 × 10–20 seconds.',
      lv: [
        { n: 'Band curl', reps: '12–20', how: 'Stand on the band with elbows at your sides. Curl, squeeze, lower slowly.' },
        { n: 'Bodyweight curl under a low bar or rings', reps: '6–12', how: 'Hang under the bar with palms up and a straight body. Keep the upper arms still and curl your forehead to your hands.' },
        { n: 'Bodyweight curl, feet elevated', reps: '6–12', how: 'Same curl with your feet on a chair so more of your weight is on the arms.' }
      ] },
    match: 'partial', eq: 'Bodyweight curls need a low bar or rings, and bands are the fallback. Chin-ups already give the biceps plenty of work in a calisthenics week.' }
  ] },

/* ================= LOWER A ================= */
{ id: 'LA', name: 'Lower A', when: 'Tuesday', mins: '55–65',
  focus: 'Quad-led day. Squat first, a second leg movement, then hamstrings, calves and abs.',
  slots: [
  { id: 'la1', role: 'Squat', mus: 'Quads, glutes, adductors', star: 1,
    vol: { p: ['Quads'], s: ['Glutes'] },
    gym: { n: 'Barbell back squat', sets: 3, reps: '5–8', rest: '2–3 min', rir: '2–3',
      how: 'Bar on the upper traps, feet about shoulder-width, toes out 15–30°. Take a big breath and brace, sit down between your hips with knees tracking over the toes to at least parallel, then drive up with chest and hips rising together.',
      err: 'Heels lifting, knees caving in, hips shooting up first, depth shrinking as the load goes up. Set the safeties just below your bottom position.',
      alt: 'Hack squat, Smith-machine squat, or a heavy goblet squat while you learn the pattern.' },
    home: { n: 'Goblet squat → dumbbell front squat', sets: 3, reps: '8–12', rest: '2 min', rir: '1–3',
      how: 'One dumbbell held against the chest, or two resting on the shoulders. Put your heels on a 2–3 cm plate or book if your ankles are stiff. Sit straight down with elbows inside the knees and chest tall: 3 seconds down, 1-second pause, drive up.',
      err: 'Heels lifting, folding forward, cutting depth.',
      alt: 'Band squat, standing on the band with it looped over your shoulders.',
      cap: 'One 25 kg goblet → two dumbbells on the shoulders (50 kg) → 1.5 reps with a 3-second lower → front-foot-elevated split squats as the main lift.' },
    cali: { sets: 4, rest: '90 s–2 min', rir: '1–3',
      err: 'Knee collapsing inward, dropping through the last third, bouncing out of the bottom.',

function mergeState(d, s) {
  const o = JSON.parse(JSON.stringify(d));
  if (s && typeof s === 'object') {
    for (const k in o) {
      if (!(k in s) || s[k] == null) continue;
      const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
      if (isObj(o[k]) && isObj(s[k])) o[k] = Object.assign(o[k], s[k]);
      else if (Array.isArray(o[k]) === Array.isArray(s[k]) && typeof o[k] === typeof s[k]) o[k] = s[k];
    }
  }
  return o;
}
function loadState() {
  let s = null;
  if (storageOK) { try { s = JSON.parse(window.localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { s = null; } }
  return mergeState(DEFAULTS, s);
}
let state = loadState();
function save() { if (storageOK) { try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* storage full or blocked */ } } }

const STRATS = {
  recomp:   { label: 'Recomposition', mult: 0.90, p: 2.1, f: 0.8,  pct: '10% under maintenance' },
  cut:      { label: 'Fat loss',      mult: 0.80, p: 2.2, f: 0.7,  pct: '20% under maintenance' },
  bulk:     { label: 'Lean gain',     mult: 1.10, p: 1.8, f: 0.95, pct: '10% over maintenance' },
  maintain: { label: 'Maintenance',   mult: 1.00, p: 1.8, f: 0.9,  pct: 'at maintenance' }
};
const ACTIVITY = [
  [1.2, 'Sedentary: desk job, not training yet'],
  [1.4, 'Desk job, 4 sessions, 7,000–8,000 steps a day'],
  [1.5, 'Desk job, 4 sessions, 10,000+ steps a day'],
  [1.65, 'On your feet most of the day, plus training']
];
function calc() {
  const p = state.profile;
  const W = clamp(num(p.weight, 72), 35, 200), H = clamp(num(p.height, 170), 130, 220), A = clamp(num(p.age, 31), 16, 90);
  const male = p.sex !== 'f';
  const act = clamp(num(p.activity, 1.4), 1.1, 2);
  const bmr = 10 * W + 6.25 * H - 5 * A + (male ? 5 : -161);
  const tdee = bmr * act;
  const waist = num(p.waist, 0), neck = num(p.neck, 0), hip = num(p.hip, 0);
  let bf = null, bfSrc = 'assumed';
  if (waist > 0 && neck > 0 && (male || hip > 0)) {
    const v = male
      ? 495 / (1.0324 - 0.19077 * Math.log10(waist - neck) + 0.15456 * Math.log10(H)) - 450
      : 495 / (1.29579 - 0.35004 * Math.log10(waist + hip - neck) + 0.22100 * Math.log10(H)) - 450;
    if (isFinite(v) && v > 4 && v < 60) { bf = v; bfSrc = 'tape'; }
  }
  if (bf === null) bf = male ? 22 : 30;
  const lean = W * (1 - bf / 100);
  const tg = {};
  for (const k in STRATS) {
    const s = STRATS[k];
    let kcal = tdee * s.mult;
    if (k === 'cut') kcal = Math.max(kcal, bmr);
    kcal = Math.round(kcal / 25) * 25;
    const pr = Math.round(W * s.p / 5) * 5, fat = Math.round(W * s.f / 5) * 5;
    const carb = Math.max(0, Math.round((kcal - pr * 4 - fat * 9) / 4 / 5) * 5);
    tg[k] = { kcal: kcal, p: pr, f: fat, c: carb, fiber: clamp(Math.round(kcal * 14 / 1000), 25, 40) };
  }
  const strat = STRATS[p.strategy] ? p.strategy : 'recomp';
  const gain = male ? [6, 9] : [3, 5.5], tbf = male ? [11, 14] : [19, 23], mid = male ? 0.125 : 0.21;
  return {
    W: W, H: H, A: A, male: male, act: act, bmr: bmr, tdee: tdee, bf: bf, bfSrc: bfSrc, lean: lean, fatMass: W - lean,
    bmi: W / Math.pow(H / 100, 2), ffmi: lean / Math.pow(H / 100, 2), waist: waist, whtr: waist > 0 ? waist / H : null,
    tg: tg, strat: strat, cur: tg[strat], gain: gain, tbf: tbf,
    goal: [(lean + gain[0]) / (1 - mid), (lean + gain[1]) / (1 - mid)],
    water: Math.round(W * 0.035 * 10) / 10, hrmax: Math.round(208 - 0.7 * A)
  };
}

function progress() {
  const s = state.profile.start;
  if (!s) return null;
  const t0 = new Date(s + 'T00:00:00');
  if (isNaN(t0)) return null;
  const days = Math.floor((Date.now() - t0.getTime()) / 864e5);
  if (days < 0) return { future: true, week: 0, pct: 0, phase: PHASES[0] };
  const months = days / 30.44;
  return { week: Math.floor(days / 7) + 1, months: months, pct: Math.min(100, months / 48 * 100), phase: PHASES.find(p => months < p.m[1]) || PHASES[4] };
}

function scaled(food, g, k) { const st = FOODS[food].sc; return st ? Math.max(st, Math.round(g * k / st) * st) : g; }

  return WEEKMEALS.map((d, i) => ({ d: d.d, s: d.s, note: d.note, m: d.m.map((pair, j) => {
    const o = state.week[i] && state.week[i][j], ok = !!(o && getMeal(o));

    if (rate < -0.75) { head = 'Losing too fast'; text = 'Add 100–150 kcal a day. A recomposition should feel slow.'; actFlag = true; }
    else if (dWaist !== null && dWaist <= -0.5) { head = 'On track'; text = 'Your waist is shrinking. Change nothing, whatever the scale says.'; }
    else if (rate > 0.25 && dWaist !== null && dWaist >= 0.5) { head = 'Weight and waist both rising'; text = 'Remove 150 kcal a day and check for untracked oils, snacks, drinks and weekends.'; actFlag = true; }
    else { head = 'Flat'; text = 'If your lifts are still going up, stay the course: that is recomposition working. If the lifts are flat too, remove 100–150 kcal a day or add 2,000 steps.'; }
  }
  return { head: head, text: base + ' ' + text, act: actFlag };
}

function logBox(key, ex, timed) {
  const hist = state.logs[key] || [], last = hist[hist.length - 1], top = repTop(ex.reps);
  let msg = 'Nothing logged yet. Record your best set each session and you will see what to aim for next time.';
  if (last) {
    const what = (last.w > 0 ? last.w + ' kg × ' : '') + last.r + (timed ? ' s' : (last.w > 0 ? '' : ' reps'));
    const adv = last.r >= top
      ? 'Top of the range reached. Next time add the smallest step in load, or move to a harder version, and start again at the bottom of the range.'
      : 'Next time: same load, aim for ' + (timed ? (last.r + 5) + ' s' : (last.r + 1)) + '.';
    msg = 'Last: <b>' + what + '</b> on ' + fdate(last.d) + (hist.length > 1 ? ' (' + hist.length + ' entries)' : '') + '. ' + adv;
  }
  return '<div class="log"><div class="log-row">' +
    '<label>Load, kg<input type="number" inputmode="decimal" step="0.5" min="0" data-w placeholder="0 if none"></label>' +

function aiApiConfig() {

async function aiApi(sys, user) {
  const c = aiApiConfig();

  const post = b => fetch(c.base + '/chat/completions', { method: 'POST', headers: headers, body: JSON.stringify(b) });

  ${blk('How the numbers are worked out', ol([
    'Resting burn, by the Mifflin–St Jeor equation: 10 × ' + n1(c.W) + ' kg + 6.25 × ' + n0(c.H) + ' cm − 5 × ' + n0(c.A) + ' years ' + (c.male ? '+ 5' : '− 161') + ' = <b>' + n0(c.bmr) + ' kcal</b>.',

    'Protein: ' + s.p + ' g per kg = <b>' + cur.p + ' g</b>. On average, gains level off near 1.6 g per kg. The higher figure protects muscle while calories are below maintenance.',
    'Fat: ' + s.f + ' g per kg = <b>' + cur.f + ' g</b>, enough for hormones and vitamin absorption.',
    'Carbs: whatever is left, <b>' + cur.c + ' g</b>. They fuel training, so they get the remainder.',
    'Fiber: 14 g per 1,000 kcal, about <b>' + cur.fiber + ' g</b>. Water: about 35 ml per kg, <b>' + n1(c.water) + ' L</b>, plus half a litre for each hour of training.'
  ]) + '<p>Calories and protein are the two targets that matter. Carbs and fat can trade places by 20–30 g on any day, as long as fat stays above about ' + n0(c.W * 0.6) + ' g.</p>')}
  ${blk('Four strategies', tbl(['Strategy', '#Calories', '#Protein', '#Carbs', '#Fat', 'Pace', 'Use it'], [

      <dt>Fat loss</dt><dd>Losing 0.5–0.75% a week: hold. Slower than 0.25% for two weeks: remove 100–150 kcal or add 2,000 steps. Faster than 1%: add 100–150 kcal. Do not go below your resting burn of ${n0(c.bmr)} kcal without professional supervision.</dd>

function chart(list) {
  const pts = list.filter(c => c.w > 0);
  if (pts.length < 2) return '';
  const W = 600, H = 170, pad = 12, xs = pts.map(c => new Date(c.d).getTime()), x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  const sx = t => pad + (t - x0) / ((x1 - x0) || 1) * (W - 2 * pad);
  const line = (vals, cls) => {
    const v = vals.filter(p => p[1] > 0); if (v.length < 2) return '';
    const ys = v.map(p => p[1]), lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    const sy = y => H - pad - (y - lo) / ((hi - lo) || 1) * (H - 2 * pad);
    return '<polyline class="' + cls + '" points="' + v.map(p => sx(p[0]).toFixed(1) + ',' + sy(p[1]).toFixed(1)).join(' ') + '"/>' + v.map(p => '<circle class="' + cls + '" cx="' + sx(p[0]).toFixed(1) + '" cy="' + sy(p[1]).toFixed(1) + '" r="4"/>').join('');
  };
  const first = pts[0], last = pts[pts.length - 1], wz = pts.filter(c => c.waist > 0);
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Weight and waist over time">' + line(pts.map((c, i) => [xs[i], c.w]), 'cw') + line(pts.map((c, i) => [xs[i], c.waist || 0]), 'cz') + '</svg>' +
    '<p class="sub2 key"><i class="kw"></i>Weight: ' + n1(first.w) + ' to ' + n1(last.w) + ' kg' + (wz.length > 1 ? ' &nbsp; <i class="kz"></i>Waist: ' + n1(wz[0].waist) + ' to ' + n1(wz[wz.length - 1].waist) + ' cm' : '') + '. ' + fdate(first.d) + ' to ' + fdate(last.d) + '. Each line has its own scale.</p>';
}

  ${blk('Body-fat numbers and their limits', `<p>Smart scales can be off by 3–5 points and swing with hydration. The tape method this app uses is good to within 3–4 points. Calipers depend on who is pinching. A DEXA scan is the best of the group and still carries an error of 1–2 points.</p>

function vLifts() {

    rows.push([esc(last.n || key), ENVS[env] ? ENVS[env].label : esc(env), fmt(first), fmt(last), best > 0 ? n1(best) + ' kg' : '', h.length]);

  <h2>Reading the signals</h2>
  ${blk('Muscle, fat or noise?', tbl(['What you see', 'What it means'], [
    ['Lifts rising, waist flat or down, weight flat', 'Recomposition: muscle up, fat down. The best case, and invisible on the scale.'],
    ['Weight and waist both down, lifts holding', 'Fat loss.'],
    ['Weight up slowly, waist flat, lifts rising, tape up at the shoulders, arms and thighs', 'Muscle gain.'],
    ['Weight and waist both up, lifts flat', 'Mostly fat. Calories are too high.'],
    ['Weight down fast, lifts falling', 'Muscle is going with the fat. The deficit is too deep or protein is too low.'],
    ['A jump or drop of 1–2 kg overnight', 'Water. Salt, a big carb meal, a hard leg day, alcohol, travel or starting creatine. Ignore it.']
  ]))}
  ${blk('Decision rules', tbl(['Decision', 'When', 'Do'], [
    ['Add calories', 'Losing faster than 0.75% of body weight a week for 2 weeks. Or lifts down 2 weeks running with poor sleep or mood. Or, in a lean gain, under 0.25 kg a month for 4 weeks.', 'Add 100–150 kcal, from carbs.'],
    ['Cut calories', 'Recomposition: weight, waist and lifts all flat for 3 weeks. Fat loss: slower than 0.25% a week for 2 weeks. Lean gain: over 1 kg a month, or waist up 1 cm a month twice.', 'Remove 100–150 kcal from carbs or fat, or add 2,000 steps.'],
    ['Add training volume', 'A muscle’s lifts have stalled for 3–4 weeks, you are recovering well, and it gets fewer than 10 sets a week.', 'One more set on two exercises for that muscle.'],
    ['Reduce training volume', 'Soreness past 72 hours, aching joints, or performance falling on several lifts for 2 weeks.', 'Drop a set from each exercise for that area for 2 weeks.'],
    ['Deload', 'Every 6–8 weeks in Phases 2 and 3, every 4–6 weeks in a cut, or as soon as two warning signs show up together.', 'One week: same exercises, half the sets, loads down 10%.'],
    ['Diet break', 'Eight or more weeks into a deficit with rising hunger and fatigue.', 'One or two weeks at maintenance, protein unchanged.'],
    ['Change an exercise', 'Pain that persists, or no progress for 6–8 weeks despite good recovery.', 'Swap to the alternative for the same slot and keep it at least 8 weeks.']
  ], 'wide'))}
  ${ALL ? paperLog() : ''}`;
}
function vBackup() {
  return `
  <h2>Backup and reset</h2>
  <p class="lede">${storageOK ? 'Your entries are saved in this browser, on this device only.' : 'This preview cannot save between visits. Once the file is hosted or opened from your computer, entries are saved in the browser.'}</p>
  <p>To move your data to another device or keep a copy, copy the text below and store it somewhere safe. To restore, paste it back here and press Restore. Any AI key you have entered is left out of the backup.</p>
  <textarea id="bk" data-k="bk" aria-label="Backup text" spellcheck="false">${esc(backupText())}</textarea>
  <div class="row" style="margin-top:12px"><button class="btn" data-act="copy">Copy backup</button><button class="btn" data-act="restore">Restore from this text</button><button class="btn quiet" data-act="wipe">Clear all entries</button><span id="bk-msg" class="sub2" role="status"></span></div>
  ${paperLog()}`;
}

/* ================= ONE-PAGE VIEW ================= */
const VIEWS = {
  'plan.assessment': vAssessment, 'plan.roadmap': vRoadmap, 'plan.coach': vCoach,
  'train.program': vProgram, 'train.progress': vProgress, 'train.warmup': vWarmup, 'train.cardio': vCardio, 'train.swap': vSwap, 'train.compare': vCompare,
  'eat.targets': vTargets, 'eat.meals': vMeals, 'eat.ai': vAi, 'eat.prep': vPrep, 'eat.grocery': vGrocery, 'eat.storage': vStorage, 'eat.out': vOut, 'eat.supps': vSupps,
  'recover.recovery': vRecovery, 'recover.desk': vDesk, 'recover.signs': vSigns,
  'track.checkin': vCheckin, 'track.lifts': vLifts, 'track.rules': vRules, 'track.backup': vBackup
};
function viewAll() {
  const skip = { 'eat.ai': 1, 'track.checkin': 1, 'track.lifts': 1, 'track.backup': 1 };
  ALL = true;
  let h = '<p class="note noprint">The whole plan on one page. Use your browser’s Print command and choose Save as PDF. <button class="btn tiny" data-act="go" data-go="plan.assessment">Back to the app</button></p>';
  try {
    for (const n of NAV) {
      h += '<div class="allhead">' + n.label + '</div>';
      for (const t of n.tabs) { const id = n.g + '.' + t[0]; if (!skip[id]) h += '<section class="blk">' + VIEWS[id]() + '</section>'; }
    }
  } finally { ALL = false; }
  return h;
}

/* ================= APP ================= */
function applyTheme() {
  const r = document.documentElement;
  if (state.theme === 'light' || state.theme === 'dark') r.setAttribute('data-theme', state.theme); else r.removeAttribute('data-theme');
}
function renderTop() {
  const c = calc(), pr = progress(), started = pr && !pr.future;
  $('#tb').innerHTML = '<div class="wide"><small>Phase</small><b>' + STRATS[c.strat].label + '</b></div>' +
    '<div><small>Target</small><b>' + n0(c.cur.kcal) + ' kcal</b></div>' +
    '<div class="wide"><small>Protein</small><b>' + c.cur.p + ' g</b></div>' +
    '<div><small>' + (started ? 'Week' : 'Start date') + '</small><b>' + (started ? pr.week : (pr ? 'Ahead' : 'Not set')) + '</b></div>';
}
function renderNav() {
  $('#rail').innerHTML = NAV.map(n => {
    const on = state.view.g === n.g;
    return '<div class="grp' + (on ? ' on' : '') + '"><button data-act="go" data-go="' + n.g + '"' + (on ? ' aria-current="page"' : '') + '>' + n.label + '</button><div class="sub">' +
      n.tabs.map(t => '<button data-act="go" data-go="' + n.g + '.' + t[0] + '" class="' + (on && state.view.t === t[0] ? 'on' : '') + '">' + t[1] + '</button>').join('') + '</div></div>';
  }).join('');
}
function renderFoot() {
  $('#foot').innerHTML = '<div class="row noprint"><span>Paper</span><div class="seg">' +
    [['auto', 'Auto'], ['light', 'Whiteprint'], ['dark', 'Blueprint']].map(t => '<button data-act="theme" data-v="' + t[0] + '" aria-pressed="' + (state.theme === t[0]) + '">' + t[1] + '</button>').join('') +
    '</div><button class="btn quiet" data-act="go" data-go="all">Whole plan on one page</button></div>' +
    '<p>General fitness and nutrition guidance, not medical advice. See a doctor before starting if you have a medical condition, and a physiotherapist for pain that does not settle.</p>' +
    '<p>Grocery prices: Statistics Canada, table 18-10-0245, Alberta averages for September 2026, except where marked as estimates. Food storage times and cooking temperatures follow Health Canada guidance.</p>';
}
function renderView() {
  const v = state.view, el = $('#view'), tabs = $('#tabs');
  if (v.g === 'all') { tabs.hidden = true; tabs.innerHTML = ''; el.innerHTML = viewAll(); return; }
  const grp = NAV.find(n => n.g === v.g) || NAV[0];
  tabs.hidden = false;
  tabs.innerHTML = grp.tabs.map(t => '<button role="tab" aria-selected="' + (t[0] === v.t) + '" class="' + (t[0] === v.t ? 'on' : '') + '" data-act="go" data-go="' + grp.g + '.' + t[0] + '">' + t[1] + '</button>').join('');
  el.innerHTML = (VIEWS[grp.g + '.' + v.t] || VIEWS[grp.g + '.' + grp.tabs[0][0]])();
  const on = tabs.querySelector('.on');
  if (on && tabs.scrollWidth > tabs.clientWidth) tabs.scrollLeft = Math.max(0, on.offsetLeft - 16);
}
function render() { renderTop(); renderNav(); renderView(); renderFoot(); }
function rerender() {
  const a = document.activeElement, key = a && a.getAttribute ? a.getAttribute('data-k') : null, y = window.scrollY;
  renderTop(); renderView();
  if (key) { const el = document.querySelector('[data-k="' + key + '"]'); if (el) { try { el.focus({ preventScroll: true }); } catch (err) { el.focus(); } } }
  window.scrollTo(0, y);
}
function softRefresh() {
  const o = $('#assess-out'); if (o) o.innerHTML = assessOut();
  const tl = $('#tl'); if (tl) tl.innerHTML = timeline();
  renderTop();
}
function setView(g, tab) {
  if (g === 'all') state.view = { g: 'all', t: '' };
  else {
    const grp = NAV.find(n => n.g === g); if (!grp) return;
    const t = tab && grp.tabs.some(x => x[0] === tab) ? tab : (state.lastTab[g] && grp.tabs.some(x => x[0] === state.lastTab[g]) ? state.lastTab[g] : grp.tabs[0][0]);
    state.view = { g: g, t: t }; state.lastTab[g] = t;
  }
  save(); render(); window.scrollTo(0, 0);
  try { window.history.replaceState(null, '', '#' + state.view.g + (state.view.t ? '-' + state.view.t : '')); } catch (e) { /* sandboxed preview */ }
}
function say(id, text) { const el = document.getElementById(id); if (el) el.textContent = text; }

const ACT = {
  go(t) { const p = t.dataset.go.split('.'); setView(p[0], p[1]); },
  env(t) { state.env = t.dataset.v; save(); rerender(); },
  day(t) { state.day = t.dataset.v; save(); rerender(); },
  level(t) { state.level = +t.dataset.v; state.lv = {}; save(); rerender(); },
  lv(t) { state.lv[t.dataset.slot] = +t.dataset.v; save(); rerender(); },
  mealday(t) { state.mealDay = +t.dataset.v; save(); rerender(); },
  log(t) {
    const box = t.closest('.log'), w = parseFloat(box.querySelector('[data-w]').value), r = parseFloat(box.querySelector('[data-r]').value);
    if (!isFinite(r) || r <= 0) { box.querySelector('[data-r]').focus(); return; }
    const key = t.dataset.key, timed = /Seconds/.test(box.textContent);
    (state.logs[key] = state.logs[key] || []).push({ d: today(), w: isFinite(w) && w > 0 ? w : 0, r: r, n: t.dataset.name, t: timed ? 1 : 0 });
    if (state.logs[key].length > 400) state.logs[key].shift();
    save(); rerender();
  },
  dellog(t) { const a = state.logs[t.dataset.key]; if (a) { a.pop(); if (!a.length) delete state.logs[t.dataset.key]; } save(); rerender(); },
  savecheck() {
    const val = id => { const el = document.getElementById(id); return el ? el.value : ''; };
    const d = val('ci-d'), w = parseFloat(val('ci-w'));
    if (!d || !isFinite(w) || w <= 0) { say('ci-msg', 'Enter the date and your average weight.'); return; }
    const f = id => { const x = parseFloat(val(id)); return isFinite(x) && x > 0 ? x : 0; };
    const sess = val('ci-sess');
    const entry = { d: d, w: w, waist: f('ci-waist'), sess: sess === '' ? '' : clamp(parseInt(sess, 10) || 0, 0, 14), sleep: f('ci-sleep'), energy: clamp(Math.round(f('ci-energy')), 0, 5), sh: f('ci-sh'), arm: f('ci-arm'), note: val('ci-note').slice(0, 140) };
    state.checkins = state.checkins.filter(c => c.d !== d); state.checkins.push(entry);
    save(); rerender(); say('ci-msg', 'Saved.');
  },
  delcheck(t) { state.checkins = state.checkins.filter(c => c.d !== t.dataset.d); save(); rerender(); },
  resetprices() { state.prices = {}; save(); rerender(); },
  uncheck() { state.checked = {}; save(); rerender(); },
  theme(t) { state.theme = t.dataset.v; applyTheme(); save(); renderFoot(); },
  copy() {
    const ta = document.getElementById('bk'); if (!ta) return;
    ta.value = backupText(); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) { navigator.clipboard.writeText(ta.value).then(() => say('bk-msg', 'Copied.'), () => say('bk-msg', 'Select the text and copy it by hand.')); return; }
    say('bk-msg', ok ? 'Copied.' : 'Select the text and copy it by hand.');
  },
  restore() {
    const ta = document.getElementById('bk'); if (!ta) return;
    let obj = null; try { obj = JSON.parse(ta.value); } catch (e) { obj = null; }
    if (!obj || typeof obj !== 'object' || !obj.profile) { say('bk-msg', 'That text is not a valid backup. Nothing was changed.'); return; }
    const keep = state.ai.key;
    state = mergeState(DEFAULTS, obj); state.view = { g: 'track', t: 'backup' }; if (!state.ai.key) state.ai.key = keep;
    resetPlanCache(); save(); applyTheme(); render(); say('bk-msg', 'Restored.');
  },
  wipe(t) {
    if (t.dataset.sure !== '1') { t.dataset.sure = '1'; t.textContent = 'Press again to clear everything'; return; }
    state = mergeState(DEFAULTS, null); state.view = { g: 'track', t: 'backup' };
    resetPlanCache(); save(); applyTheme(); render(); say('bk-msg', 'Cleared.');
  }
};

Object.assign(ACT, AI_ACT);

document.addEventListener('click', e => {
  const t = e.target.closest ? e.target.closest('[data-act]') : null;
  if (t && ACT[t.dataset.act]) ACT[t.dataset.act](t, e);
});
document.addEventListener('toggle', e => {
  const d = e.target;
  if (d && d.dataset && d.dataset.open) { if (d.open) openSet[d.dataset.open] = 1; else delete openSet[d.dataset.open]; }
}, true);
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset && t.dataset.pf && t.tagName === 'INPUT' && t.type !== 'date') { state.profile[t.dataset.pf] = t.value; save(); softRefresh(); }
  else if (t.dataset && t.dataset.aif && t.tagName === 'INPUT') aiForm[t.dataset.aif] = t.value;
  else if (t.dataset && t.dataset.ai && t.tagName === 'INPUT') { state.ai[t.dataset.ai] = t.value; save(); }
});
document.addEventListener('change', e => {
  const t = e.target; if (!t.dataset) return;
  if (t.dataset.pf) {
    state.profile[t.dataset.pf] = t.value; save();
    if (t.dataset.pf === 'sex') setTimeout(rerender, 0); else softRefresh();
  } else if (t.dataset.price) {
    const v = parseFloat(t.value);
    if (isFinite(v) && v >= 0) state.prices[t.dataset.price] = v; else delete state.prices[t.dataset.price];
    save(); setTimeout(rerender, 0);
  } else if (t.dataset.chk) {
    if (t.checked) state.checked[t.dataset.chk] = 1; else delete state.checked[t.dataset.chk];
    save(); const li = t.closest('li'); if (li) li.classList.toggle('done', t.checked);
  } else if (t.dataset.aif) {
    aiForm[t.dataset.aif] = t.value; if (t.tagName === 'SELECT') { aiTarget = ''; setTimeout(rerender, 0); }
  } else if (t.dataset.ai) {
    state.ai[t.dataset.ai] = t.value; save(); if (t.tagName === 'SELECT') setTimeout(rerender, 0);
  }
});

(function init() {
  applyTheme();
  document.getElementById('app').innerHTML =
    '<header class="top"><button class="mark" data-act="go" data-go="plan.assessment" aria-label="Blueprint: go to the assessment">Blueprint</button><div class="tb" id="tb"></div></header>' +
    '<div class="shell"><nav class="rail" id="rail" aria-label="Sections"></nav>' +
    '<main id="main"><div class="tabs" id="tabs" role="tablist"></div><div id="view"></div><footer class="foot" id="foot"></footer></main></div>';
  let h = ''; try { h = (window.location.hash || '').slice(1); } catch (e) { h = ''; }
  if (h) {
    const parts = h.split('-');
    if (parts[0] === 'all') state.view = { g: 'all', t: '' };
    else { const grp = NAV.find(n => n.g === parts[0]); if (grp) state.view = { g: grp.g, t: grp.tabs.some(x => x[0] === parts[1]) ? parts[1] : grp.tabs[0][0] }; }
  }
  if (state.view.g !== 'all' && !VIEWS[state.view.g + '.' + state.view.t]) state.view = { g: 'plan', t: 'assessment' };
  render();
})();

</script>
</body>
</html>
